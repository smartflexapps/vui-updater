name: Update VUI Daily

on:
  schedule:
    - cron: '0 0 * * *' # Corre automáticamente todos los días a la medianoche UTC
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Usamos explícitamente Node 24 para evitar el bug de 'Premature close' 
          # provocado por las versiones intermedias de Node 22 en las APIs de Google.
          node-version: '24' 

      - name: Install dependencies
        run: npm install

      - name: Run updater
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: npm start
